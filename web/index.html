<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红利策略 · 回测监控</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d212a; --line:#262b36;
    --fg:#e8ecf3; --dim:#8a93a5; --blue:#4aa3ff; --green:#31d07d;
    --red:#ff5c5c; --amber:#f5a623;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;font-size:14px}
  .wrap{max-width:1160px;margin:0 auto;padding:22px 24px 48px}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.3px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;
        font-size:12px;background:#232936;color:#9fb4d0}
  .pill.run{background:#152a3d;color:#6cb6ff}
  .pill.done{background:#14301f;color:#5fd99a}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .run .dot{animation:blink 1.1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;color:var(--dim);background:#1a1e26;border:1px solid var(--line);
        padding:3px 9px;border-radius:6px}
  .chip b{color:#cfe0f5;font-weight:600}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:16px 18px;margin-bottom:14px}

  .prog-top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .big{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .big small{font-size:14px;font-weight:500;color:var(--dim);margin-left:3px}
  .meta{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
  .meta div{text-align:right}
  .k{color:var(--dim);font-size:12px;margin-bottom:3px}
  .v{font-variant-numeric:tabular-nums;font-weight:600}

  .track{height:8px;background:#0b0d12;border-radius:6px;overflow:hidden;margin:14px 0 6px}
  .track>i{display:block;height:100%;width:0;border-radius:6px;
           background:linear-gradient(90deg,#2b6fc4,#4aa3ff);
           transition:width .45s cubic-bezier(.22,.61,.36,1)}
  .subline{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}

  .chartbox{position:relative}
  canvas{width:100%;height:260px;display:block}
  .tip{position:absolute;pointer-events:none;background:#0b0e14ee;border:1px solid var(--line);
       border-radius:8px;padding:6px 9px;font-size:12px;color:#dfe7f3;display:none;
       white-space:nowrap;transform:translate(-50%,-120%)}

  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
  @media (max-width:860px){.grid{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #20242d}
  th{color:var(--dim);font-weight:500;font-size:12px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;padding:1px 7px;border-radius:5px}
  .t-red{background:#3a2323;color:#ff9d9d}
  .t-green{background:#173225;color:#78e0a6}
  .buy{color:var(--green)} .sell{color:var(--red)}
  .codes{color:#c8d4e6;font-size:12px;line-height:1.5;word-break:break-all}
  .empty{color:var(--dim);font-size:12px}

  .years{display:flex;gap:10px;align-items:flex-end;height:96px;margin-top:6px}
  .yb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
  .yb .bar{width:100%;border-radius:4px 4px 0 0;min-height:2px;
           background:linear-gradient(180deg,#4aa3ff,#2b6fc4)}
  .yb .bar.neg{background:linear-gradient(180deg,#ff5c5c,#a33)}
  .yb .lab{font-size:11px;color:var(--dim)}
  .yb .val{font-size:11px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>红利策略 · 本地回测</h1>
    <span id="status" class="pill"><i class="dot"></i><span>连接中…</span></span>
    <div class="chips" id="chips"></div>
  </header>

  <div class="card">
    <div class="prog-top">
      <div class="big"><span id="pct">0.0</span><small>%</small></div>
      <div>
        <div class="k">当前阶段</div>
        <div class="v" id="phase">—</div>
      </div>
      <div class="meta">
        <div><div class="k">调仓日</div><div class="v" id="curdate">—</div></div>
        <div><div class="k">进度</div><div class="v" id="done">—</div></div>
        <div><div class="k">已用 / 剩余</div><div class="v" id="time">—</div></div>
        <div><div class="k">累计收益</div><div class="v" id="ret">—</div></div>
      </div>
    </div>
    <div class="track"><i id="fill"></i></div>
    <div class="subline"><span id="speed">—</span><span id="updated">—</span></div>
    <div class="subline" style="margin-top:4px">
      <span id="warn" style="color:var(--amber)"></span><span></span>
    </div>
  </div>

  <div class="card">
    <div class="k" style="margin-bottom:6px">净值曲线（起始 1.00）</div>
    <div class="chartbox">
      <canvas id="chart"></canvas>
      <div class="tip" id="tip"></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="k" style="margin-bottom:6px">最近调仓</div>
      <table>
        <thead><tr><th style="width:96px">日期</th><th style="width:62px">风格</th><th>目标池</th></tr></thead>
        <tbody id="picks"><tr><td colspan="3" class="empty">暂无</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <div class="k" style="margin-bottom:6px">最近成交</div>
      <table>
        <thead><tr><th style="width:96px">日期</th><th style="width:46px">方向</th><th>代码</th><th class="num" style="width:78px">股数</th><th class="num" style="width:70px">价格</th></tr></thead>
        <tbody id="trades"><tr><td colspan="5" class="empty">暂无</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="prog-top" style="margin-bottom:10px">
      <div><div class="k">期末资产</div><div class="v" id="s_final">—</div></div>
      <div><div class="k">累计</div><div class="v" id="s_ret">—</div></div>
      <div><div class="k">年化</div><div class="v" id="s_cagr">—</div></div>
      <div><div class="k">最大回撤</div><div class="v" id="s_dd">—</div></div>
      <div><div class="k">交易笔数</div><div class="v" id="s_tr">—</div></div>
      <div><div class="k">耗时</div><div class="v" id="s_secs">—</div></div>
    </div>
    <div class="k">年度收益</div>
    <div class="years" id="years"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let NAV = [], HOVER = -1;

const fmtT = s => {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + '秒';
  const m = Math.floor(s / 60);
  return m + '分' + String(s % 60).padStart(2, '0') + '秒';
};

/* ---------------- 图表 ---------------- */
function layout() {
  const c = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h, pad: { l: 50, r: 14, t: 12, b: 24 } };
}

function draw() {
  const { g, w, h, pad } = layout();
  g.clearRect(0, 0, w, h);
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;

  if (NAV.length < 2) {
    g.fillStyle = '#8a93a5'; g.font = '12px Microsoft YaHei';
    g.fillText('等待回测数据…', pad.l, h / 2);
    return;
  }
  const ys = NAV.map(p => p[1]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const padY = (hi - lo) * 0.14 || 0.02;
  lo -= padY; hi += padY;

  const X = i => pad.l + iw * i / (NAV.length - 1);
  const Y = v => pad.t + ih * (1 - (v - lo) / (hi - lo));

  g.font = '11px Microsoft YaHei';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, y = Y(v);
    g.strokeStyle = '#20242d'; g.beginPath();
    g.moveTo(pad.l, y); g.lineTo(w - pad.r, y); g.stroke();
    g.fillStyle = '#8a93a5'; g.fillText(v.toFixed(2), 6, y + 4);
  }
  // 1.00 基准线
  if (lo < 1 && hi > 1) {
    g.strokeStyle = '#3a4150'; g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(pad.l, Y(1)); g.lineTo(w - pad.r, Y(1)); g.stroke();
    g.setLineDash([]);
  }

  g.beginPath(); g.moveTo(X(0), Y(ys[0]));
  NAV.forEach((p, i) => g.lineTo(X(i), Y(p[1])));
  g.lineTo(X(NAV.length - 1), pad.t + ih);
  g.lineTo(X(0), pad.t + ih); g.closePath();
  const grad = g.createLinearGradient(0, pad.t, 0, pad.t + ih);
  grad.addColorStop(0, 'rgba(74,163,255,.30)');
  grad.addColorStop(1, 'rgba(74,163,255,0)');
  g.fillStyle = grad; g.fill();

  g.beginPath(); g.moveTo(X(0), Y(ys[0]));
  NAV.forEach((p, i) => g.lineTo(X(i), Y(p[1])));
  g.strokeStyle = '#4aa3ff'; g.lineWidth = 1.8; g.lineJoin = 'round'; g.stroke();

  const li = NAV.length - 1;
  g.beginPath(); g.arc(X(li), Y(ys[li]), 3.4, 0, 7); g.fillStyle = '#4aa3ff'; g.fill();

  if (HOVER >= 0 && HOVER < NAV.length) {
    const x = X(HOVER), y = Y(NAV[HOVER][1]);
    g.strokeStyle = '#5a6478'; g.setLineDash([3, 3]);
    g.beginPath(); g.moveTo(x, pad.t); g.lineTo(x, pad.t + ih); g.stroke();
    g.setLineDash([]);
    g.beginPath(); g.arc(x, y, 3.6, 0, 7); g.fillStyle = '#fff'; g.fill();
  }

  g.fillStyle = '#8a93a5';
  g.fillText(NAV[0][0], pad.l, h - 7);
  const t = NAV[li][0];
  g.fillText(t, w - pad.r - g.measureText(t).width, h - 7);
}

/* ---------------- 交互 ---------------- */
$('chart').addEventListener('mousemove', e => {
  if (NAV.length < 2) return;
  const c = $('chart'), r = c.getBoundingClientRect();
  const pad = { l: 50, r: 14 }, iw = c.clientWidth - pad.l - pad.r;
  const x = e.clientX - r.left;
  let i = Math.round((x - pad.l) / iw * (NAV.length - 1));
  i = Math.max(0, Math.min(NAV.length - 1, i));
  HOVER = i;
  const tip = $('tip');
  tip.style.display = 'block';
  tip.style.left = (pad.l + iw * i / (NAV.length - 1)) + 'px';
  tip.style.top = (e.clientY - r.top) + 'px';
  const v = NAV[i][1];
  tip.innerHTML = `${NAV[i][0]}　<b>${v.toFixed(4)}</b>　(${(v - 1 >= 0 ? '+' : '') + ((v - 1) * 100).toFixed(2)}%)`;
  draw();
});
$('chart').addEventListener('mouseleave', () => {
  HOVER = -1; $('tip').style.display = 'none'; draw();
});
window.addEventListener('resize', draw);

/* ---------------- 轮询 ---------------- */
async function tick() {
  try {
    const d = await (await fetch('progress.json?t=' + Date.now(), { cache: 'no-store' })).json();

    const st = $('status');
    const running = d.status === 'running';
    st.className = 'pill ' + (running ? 'run' : d.status === 'done' ? 'done' : '');
    st.querySelector('span').textContent =
      running ? '回测中' : d.status === 'done' ? '已完成' : '空闲';

    $('chips').innerHTML = Object.entries(d.params || {})
      .map(([k, v]) => `<span class="chip">${k} <b>${v}</b></span>`).join('');

    $('pct').textContent = (d.pct || 0).toFixed(1);
    $('fill').style.width = Math.min(100, d.pct || 0) + '%';
    $('phase').textContent = d.phase || '—';
    $('curdate').textContent = d.cur_date || '—';
    $('done').textContent = d.total ? `${d.done}/${d.total}` : '—';
    $('time').textContent = d.elapsed ? `${fmtT(d.elapsed)} / ${fmtT(d.eta)}` : '—';
    $('speed').textContent = d.speed ? `速度 ${d.speed.toFixed(1)} 月/秒` : '';
    $('updated').textContent = d.updated ? `更新于 ${d.updated}` : '';

    // 卡死提示：running 状态但快照超过 20 秒没更新，说明进程可能已经被杀
    if (running && d.updated) {
      const [h, m, s] = d.updated.split(':').map(Number);
      const now = new Date();
      const t = new Date(now); t.setHours(h, m, s, 0);
      const lag = (now - t) / 1000;
      $('warn').textContent = lag > 20 && lag < 3600
        ? `⚠ 快照已 ${Math.round(lag)} 秒未更新，回测可能已中断` : '';
    } else {
      $('warn').textContent = '';
    }

    const nav = d.nav || [];
    if (nav.length) {
      NAV = nav;
      draw();
      // 跑完后以正式统计为准（进度里的最后一个点只到「最后一次调仓日」，
      // 不是回测区间最后一天，两者会差几天）
      let r;
      if (d.status === 'done' && d.stats && d.stats.total_return !== undefined) {
        r = d.stats.total_return;
      } else {
        r = (nav[nav.length - 1][1] - 1) * 100;
      }
      $('ret').textContent = (r >= 0 ? '+' : '') + r.toFixed(2) + '%';
      $('ret').style.color = r >= 0 ? 'var(--green)' : 'var(--red)';
    }

    const picks = (d.picks || []).slice().reverse();
    $('picks').innerHTML = picks.length ? picks.map(p =>
      `<tr><td>${p[0]}</td>
           <td><span class="tag ${p[2] === 'red' ? 't-red' : 't-green'}">${p[2] === 'red' ? '进攻' : '防守'}</span></td>
           <td class="codes">${p[1] || '—'}</td></tr>`).join('')
      : '<tr><td colspan="3" class="empty">暂无</td></tr>';

    const trs = (d.trades || []).slice().reverse();
    $('trades').innerHTML = trs.length ? trs.map(t =>
      `<tr><td>${t[0]}</td>
           <td class="${t[2] === 'buy' ? 'buy' : 'sell'}">${t[2] === 'buy' ? '买入' : '卖出'}</td>
           <td>${t[1]}</td><td class="num">${t[3]}</td><td class="num">${t[4]}</td></tr>`).join('')
      : '<tr><td colspan="5" class="empty">暂无</td></tr>';

    if (d.stats && d.stats.total_return !== undefined) {
      $('resultCard').style.display = 'block';
      $('s_final').textContent = (d.stats.final || 0).toLocaleString();
      $('s_ret').textContent = d.stats.total_return.toFixed(2) + '%';
      $('s_cagr').textContent = d.stats.cagr.toFixed(2) + '%';
      $('s_dd').textContent = d.stats.max_dd.toFixed(2) + '%';
      $('s_tr').textContent = d.stats.trades;
      $('s_secs').textContent = d.stats.secs ? d.stats.secs + 's' : '—';

      const ys = d.yearly || [];
      const mx = Math.max(1, ...ys.map(y => Math.abs(y[1])));
      $('years').innerHTML = ys.map(([y, v]) =>
        `<div class="yb" title="${y} 年 ${v}%">
           <div class="val" style="color:${v >= 0 ? 'var(--green)' : 'var(--red)'}">${v > 0 ? '+' : ''}${v.toFixed(1)}%</div>
           <div class="bar ${v < 0 ? 'neg' : ''}" style="height:${Math.max(2, Math.abs(v) / mx * 66)}px"></div>
           <div class="lab">${y}</div>
         </div>`).join('');
    }
  } catch (e) {
    $('status').className = 'pill';
    $('status').querySelector('span').textContent = '未连接';
  }
}

tick();
setInterval(tick, 800);
</script>
</body>
</html>
